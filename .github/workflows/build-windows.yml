name: build-windows-exe

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 第一步：把 Python 指纹代理 sidecar 打包成独立的 curlffi_proxy.exe
      # （serve-only 模式只依赖 curl_cffi + cryptography，无需 playwright/camoufox）
      - name: Build Python sidecar (curlffi_proxy.exe)
        shell: pwsh
        run: |
          pip install curl_cffi cryptography pyinstaller
          pyinstaller --onefile --name curlffi_proxy `
            --distpath sidecar `
            --collect-all curl_cffi `
            curlffi_proxy.py

      # 第二步：安装 Electron 依赖并用 electron-builder 打包（自动带上 sidecar）
      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows Electron app
        shell: pwsh
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npx electron-builder --win

      - uses: actions/upload-artifact@v4
        with:
          name: vivo-wuxian-windows
          path: dist/*.exe
