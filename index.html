<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src * data:;" />
  <title>vivo无限查询</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    #toolbar {
      display: flex; align-items: center; gap: 8px;
      height: 51px; padding: 8px 12px;
      background: #f5f6f8; border-bottom: 1px solid #d8d8d8;
    }
    #url {
      flex: 1; height: 34px; padding: 0 12px;
      border: 1px solid #c8c8c8; border-radius: 6px; font-size: 14px; outline: none;
    }
    #url:focus { border-color: #0a7cff; }
    button {
      height: 34px; padding: 0 14px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 14px; white-space: nowrap;
    }
    #refresh { background: #0a7cff; color: #fff; font-weight: 600; }
    #refresh:hover { background: #0868d6; }
    #refresh:disabled { background: #9cc5f0; cursor: not-allowed; }
    #settingsBtn { background: #e9e9e9; color: #333; }
    #settingsBtn:hover { background: #dcdcdc; }
    #status {
      font-size: 13px; color: #555; max-width: 420px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #status.error { color: #d32f2f; }
    #logBtn { background: #e9e9e9; color: #333; }
    #logBtn:hover { background: #dcdcdc; }
    #logBtn.active { background: #333; color: #fff; }
    .zoom-group { display: flex; align-items: center; gap: 2px; margin-left: 2px; }
    .zoom-group button { width: 32px; padding: 0; font-weight: 600; }
    #zoomPct { width: auto; padding: 0 8px; font-size: 13px; font-weight: 400; }

    /* 日志面板 */
    #logPanel {
      display: none; position: fixed; left: 0; right: 0; bottom: 0; height: 200px;
      background: #1e1e1e; color: #d4d4d4; z-index: 5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; line-height: 1.5;
      overflow-y: auto; padding: 8px 12px;
      white-space: pre-wrap; word-break: break-all;
      border-top: 1px solid #333;
    }
    #logPanel.show { display: block; }
    #logPanel .l-warn { color: #f0b429; }
    #logPanel .l-error { color: #ff6b6b; }
    #logPanel .l-ok { color: #5ad07a; }

    /* 设置面板 */
    #settingsMask {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.35); z-index: 10;
      align-items: center; justify-content: center;
    }
    #settingsMask.show { display: flex; }
    #settingsPanel {
      width: 420px; max-width: 92vw; background: #fff;
      border-radius: 10px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.2);
    }
    #settingsPanel h2 { font-size: 17px; margin-bottom: 16px; }
    #settingsPanel label {
      display: block; font-size: 13px; color: #333; margin-bottom: 12px;
    }
    #settingsPanel input {
      width: 100%; height: 34px; margin-top: 5px; padding: 0 10px;
      border: 1px solid #c8c8c8; border-radius: 6px; font-size: 14px; outline: none;
    }
    #settingsPanel input:focus { border-color: #0a7cff; }
    #settingsPanel .row { display: flex; gap: 10px; }
    #settingsPanel .row label { flex: 1; }
    #settingsPanel .hint {
      font-size: 12px; color: #888; line-height: 1.5; margin: 4px 0 14px;
    }
    #settingsPanel .actions { display: flex; gap: 10px; justify-content: flex-end; }
    #saveSettings { background: #0a7cff; color: #fff; font-weight: 600; }
    #saveSettings:hover { background: #0868d6; }
    #closeSettings { background: #e9e9e9; color: #333; }
    #closeSettings:hover { background: #dcdcdc; }
  </style>
</head>
<body>
  <div id="toolbar">
    <input id="url" type="text" placeholder="输入网址后按回车打开" />
    <button id="refresh">🔄 刷新</button>
    <button id="settingsBtn">⚙ 设置</button>
    <button id="logBtn">📋 日志</button>
    <span class="zoom-group">
      <button id="zoomOut" title="缩小">−</button>
      <button id="zoomPct" title="点击重置为 100%">100%</button>
      <button id="zoomIn" title="放大">+</button>
    </span>
    <span id="status">初始化中…</span>
  </div>

  <div id="logPanel"></div>

  <div id="settingsMask">
    <div id="settingsPanel">
      <h2>代理设置</h2>
      <label>trade_no（业务编号）
        <input id="setTradeNo" type="text" placeholder="例如 A461584673943" />
      </label>
      <label>secret（业务密钥）
        <input id="setSecret" type="text" placeholder="例如 jg3p8xBYPpM7J6sy" />
      </label>
      <div class="row">
        <label>代理账号（账密认证）
          <input id="setProxyUser" type="text" placeholder="选填，白名单可留空" />
        </label>
        <label>代理密码
          <input id="setProxyPass" type="password" placeholder="选填" />
        </label>
      </div>
      <div class="row">
        <label>每次提取 IP 数量
          <input id="setNum" type="number" min="1" max="200" />
        </label>
        <label>优质 IP 池大小 N
          <input id="setN" type="number" min="1" max="200" />
        </label>
      </div>
      <label>质量检测延迟阈值（毫秒）
        <input id="setMaxLatency" type="number" min="100" max="15000" placeholder="例如 2000" />
      </label>
      <div class="hint">
        后台会持续拉取并访问 https://userappeal.vivo.com.cn/#/index 检测 IP 质量；
        仅当响应耗时低于延迟阈值且页面含「vivo账号申诉」才算优质 IP；
        若代理返回 407（需要认证），请在「代理账号/密码」中填写 91http 的账密，
        或用白名单验证；池满 N 个即暂停拉取，低于 N 自动补充；当前 IP 到期前 20 秒自动换新。
      </div>
      <div class="actions">
        <button id="closeSettings">取消</button>
        <button id="saveSettings">保存</button>
      </div>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('url');
    const refreshBtn = document.getElementById('refresh');
    const settingsBtn = document.getElementById('settingsBtn');
    const statusEl = document.getElementById('status');
    const logBtn = document.getElementById('logBtn');
    const logPanel = document.getElementById('logPanel');
    const zoomOutBtn = document.getElementById('zoomOut');
    const zoomPctBtn = document.getElementById('zoomPct');
    const zoomInBtn = document.getElementById('zoomIn');
    const settingsMask = document.getElementById('settingsMask');
    const setTradeNo = document.getElementById('setTradeNo');
    const setSecret = document.getElementById('setSecret');
    const setProxyUser = document.getElementById('setProxyUser');
    const setProxyPass = document.getElementById('setProxyPass');
    const setNum = document.getElementById('setNum');
    const setN = document.getElementById('setN');
    const setMaxLatency = document.getElementById('setMaxLatency');
    const saveSettingsBtn = document.getElementById('saveSettings');
    const closeSettingsBtn = document.getElementById('closeSettings');

    let poolStatus = {
      currentProxy: null,
      currentExpireAt: null,
      poolSize: 0,
      targetN: 0,
      refilling: false,
      swapping: false,
      lastError: null,
      configured: false,
    };

    function normalizeUrl(raw) {
      raw = (raw || '').trim();
      if (!raw) return null;
      if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
      return raw;
    }

    function navigate() {
      const u = normalizeUrl(urlInput.value);
      if (!u) return;
      window.proxyApi.navigate(u);
    }

    function renderStatus() {
      const s = poolStatus;
      let text = '池 ' + s.poolSize + '/' + s.targetN;
      if (s.currentProxy && s.currentExpireAt) {
        const remain = Math.max(0, Math.round((s.currentExpireAt - Date.now()) / 1000));
        text += '　代理 ' + s.currentProxy + '　剩余 ' + remain + 's';
      }
      statusEl.textContent = text;
    }

    // 工具栏事件
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') navigate();
    });

    refreshBtn.addEventListener('click', async () => {
      refreshBtn.disabled = true;
      try {
        await window.proxyApi.refreshProxy();
      } catch (e) {
        /* 忽略，状态由 pool-status 推送 */
      } finally {
        refreshBtn.disabled = false;
      }
    });

    // 日志面板
    function appendLog(line) {
      const div = document.createElement('div');
      if (/\[(warn|error)\]/i.test(line)) div.className = /\[error\]/i.test(line) ? 'l-error' : 'l-warn';
      else if (/\[ok\]/i.test(line)) div.className = 'l-ok';
      div.textContent = line;
      logPanel.appendChild(div);
      while (logPanel.childElementCount > 300) logPanel.removeChild(logPanel.firstChild);
      const nearBottom = logPanel.scrollHeight - logPanel.scrollTop - logPanel.clientHeight < 40;
      if (nearBottom) logPanel.scrollTop = logPanel.scrollHeight;
    }

    let logOpen = false;
    function setLogOpen(open) {
      logOpen = open;
      logPanel.classList.toggle('show', open);
      logBtn.classList.toggle('active', open);
      window.proxyApi.setLogOpen(open);
      if (open) logPanel.scrollTop = logPanel.scrollHeight;
    }
    logBtn.addEventListener('click', () => setLogOpen(!logOpen));

    // 缩放控制
    function renderZoom(f) {
      zoomPctBtn.textContent = Math.round(f * 100) + '%';
    }
    zoomOutBtn.addEventListener('click', async () => {
      try { renderZoom(await window.proxyApi.zoomBy(-0.1)); } catch (e) { /* 忽略 */ }
    });
    zoomInBtn.addEventListener('click', async () => {
      try { renderZoom(await window.proxyApi.zoomBy(0.1)); } catch (e) { /* 忽略 */ }
    });
    zoomPctBtn.addEventListener('click', async () => {
      try { renderZoom(await window.proxyApi.zoomReset()); } catch (e) { /* 忽略 */ }
    });

    // 设置面板
    function openSettingsPanel() {
      settingsMask.classList.add('show');
      window.proxyApi.setSettingsOpen(true);
    }
    function closeSettingsPanel() {
      settingsMask.classList.remove('show');
      window.proxyApi.setSettingsOpen(false);
    }
    settingsBtn.addEventListener('click', async () => {
      const s = await window.proxyApi.getSettings();
      setTradeNo.value = s.trade_no || '';
      setSecret.value = s.secret || '';
      setProxyUser.value = s.proxy_user || '';
      setProxyPass.value = s.proxy_pass || '';
      setNum.value = s.num;
      setN.value = s.N;
      setMaxLatency.value = s.maxLatency;
      openSettingsPanel();
    });
    closeSettingsBtn.addEventListener('click', closeSettingsPanel);
    settingsMask.addEventListener('click', (e) => {
      if (e.target === settingsMask) closeSettingsPanel();
    });
    saveSettingsBtn.addEventListener('click', async () => {
      await window.proxyApi.saveSettings({
        trade_no: setTradeNo.value.trim(),
        secret: setSecret.value.trim(),
        proxy_user: setProxyUser.value.trim(),
        proxy_pass: setProxyPass.value,
        num: parseInt(setNum.value, 10),
        N: parseInt(setN.value, 10),
        maxLatency: parseInt(setMaxLatency.value, 10),
      });
      closeSettingsPanel();
    });

    // 主进程状态推送
    window.proxyApi.onPoolStatus((s) => {
      poolStatus = s;
      renderStatus();
    });
    window.proxyApi.onLog((line) => appendLog(line));
    window.proxyApi.onUrlChanged((url) => { urlInput.value = url; });

    // 每秒刷新倒计时显示
    setInterval(renderStatus, 1000);

    // 启动时同步地址栏与状态
    (async () => {
      try {
        const u = await window.proxyApi.getCurrentUrl();
        if (u && u !== 'about:blank' && u !== '') urlInput.value = u;
      } catch (e) { /* 忽略 */ }
      try {
        poolStatus = await window.proxyApi.getStatus();
        renderStatus();
      } catch (e) { /* 忽略 */ }
      try {
        const existing = await window.proxyApi.getLogs();
        if (existing && existing.length) {
          existing.forEach((line) => appendLog(line));
        }
      } catch (e) { /* 忽略 */ }
      try {
        renderZoom(await window.proxyApi.getZoom());
      } catch (e) { /* 忽略 */ }
    })();
  </script>
</body>
</html>
